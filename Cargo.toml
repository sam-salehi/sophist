[package]
name = "sophist"
version = "0.1.0"
edition = "2024"
default-run = "sophist"

[dependencies]
uuid = {version = "1", features = ["v4"]}
notify = "8.0.0"
rusqlite = "0.28.0"
embed_anything  = "0.5.5"
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "macros"] }
dotenv = "0.15"
serde = { version = "1.0", features = ["derive"] }
pulldown-cmark = "0.9"
base64 = "0.21"

